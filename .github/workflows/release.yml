name: Build APK and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Sign APK for installation
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p release
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noir-release.jks"
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-noirglass}"
            STORE_PASSWORD="$RELEASE_KEY_PASSWORD"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            KEY_ALIAS="noirglass"
            STORE_PASSWORD="temporary-release-password"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/noir-release.jks" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Noir Glass Keyboard, OU=Android, O=Noir Glass, L=NA, S=NA, C=US"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/noir-release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out release/NoirGlassKeyboard.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify release/NoirGlassKeyboard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoirGlassKeyboard-APK
          path: release/NoirGlassKeyboard.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/NoirGlassKeyboard.apk
