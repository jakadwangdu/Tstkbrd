name: Build Android and iOS apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test -s "$APK"
          ls -l "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS debug IPA (unsigned)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned debug app
        run: |
          set -euo pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then
            TARGET=(-workspace App.xcworkspace)
          else
            TARGET=(-project App.xcodeproj)
          fi
          xcodebuild "${TARGET[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/derived/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)"
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/aura-keyboard-debug-unsigned.ipa" Payload)
          unzip -tq aura-keyboard-debug-unsigned.ipa
          ls -l aura-keyboard-debug-unsigned.ipa

      - name: Upload debug IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-ipa
          path: aura-keyboard-debug-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    # The Android APK is released even when the iOS job fails.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: dist

      - name: Download IPA
        if: ${{ needs.ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-debug-ipa
          path: dist

      - name: Prepare release assets
        id: prep
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          SAFE="$(printf '%s' "$REPO" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')"
          [ -n "$SAFE" ] || SAFE=app
          OUT="$RUNNER_TEMP/assets"
          mkdir -p "$OUT"
          cp dist/app-debug.apk "$OUT/${SAFE}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          if [ -f dist/aura-keyboard-debug-unsigned.ipa ]; then
            cp dist/aura-keyboard-debug-unsigned.ipa "$OUT/${SAFE}-debug-build-${GITHUB_RUN_NUMBER}-unsigned.ipa"
          fi
          ls -l "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ steps.prep.outputs.dir }}
        run: |
          set -euo pipefail
          gh --version
          TAG="debug-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          shopt -s nullglob
          FILES=("$ASSET_DIR"/*.apk "$ASSET_DIR"/*.ipa)
          [ "${#FILES[@]}" -gt 0 ] || { echo "No release assets found"; exit 1; }
          for f in "${FILES[@]}"; do
            test -s "$f"
          done
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Automatically generated debug builds, made by GitHub Actions.

          - Run number: ${GITHUB_RUN_NUMBER}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit: ${GITHUB_SHA}

          These builds are for testing and are not Play Store or App Store releases.
          The Android APK is signed only with the temporary debug key.
          The iOS IPA is unsigned and must be re-signed with AltStore, Sideloadly or similar before it installs on an iPhone.
          NOTES
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Debug Build #${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      - name: Report download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -uo pipefail
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            URL="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
            echo "Release tag: $RELEASE_TAG"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,assets --jq '"Release title: " + .name, (.assets[] | "Asset: " + .name)'
            echo "Release page: $URL"
            {
              echo "### Release published"
              echo "Download the APK (and the IPA, if built) from the Assets section: $URL"
              echo "The Actions artifacts are also available as a backup."
              [ "$IOS_RESULT" = "success" ] || echo "Note: the iOS build did not succeed, so this release has the Android APK only."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed. The builds succeeded and the Actions artifacts remain available."
            {
              echo "### Release publishing failed"
              echo "The builds finished and the artifacts (app-debug-apk, ios-debug-ipa) are still available on this run page."
              echo "No release URL is shown because no release was created."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
